# ---------------------------------------------------------------------------
# Railway-configuratie voor de worker-service.
#
# De worker is geen web-service: hij wacht niet op verkeer maar draait continu
# een belronde. Zonder deze declaratie behandelt Railway hem als een gewone
# web-service en stopt hij de container als er even niets binnenkomt — waarna
# de worker herstart en meteen opnieuw begint te bellen.
#
# TOML in plaats van JSON omdat je hier kunt uitleggen wáárom elke regel er
# staat. Railway leest railway.toml en railway.json allebei uit de repo-root.
# ---------------------------------------------------------------------------

[build]
# De bestaande Dockerfile blijft de bron van waarheid voor de build.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Het startcommando staat hier bewust WEL, en dat is de fix voor een crashlus.
#
# In het dashboard van deze service stond een Start Command (vermoedelijk ooit
# overgenomen uit het oude Procfile: `npm run worker:build && npm run
# worker:start`). Een dashboard-startcommando overschrijft de CMD uit de
# Dockerfile. Dus draaide de container bij elke start alsnog tsc — in de
# runtime-stage, waar alleen package.json en dist/ staan en tsconfig.worker.json
# dus ontbreekt: "TS5058: The specified path does not exist".
#
# Railway's eigen regel is dat configuratie in code altijd wint van het
# dashboard. Door het commando hier vast te leggen is die dashboard-instelling
# uitgeschakeld, zonder dat iemand hem hoeft te vinden.
#
# Zonder shell-constructies, zodat Railway dit in exec-vorm draait en node PID 1
# blijft. Dat is precies waarom de CMD in de Dockerfile er zo uitziet: een shell
# ertussen geeft SIGTERM niet door en dan wordt de container hard afgeschoten.
startCommand = "node dist/worker.js"

# Een worker hoort altijd te draaien: na een crash of een herstart van het
# platform meteen weer op.
restartPolicyType = "ALWAYS"

# App Sleeping expliciet uit. Dit is het veld achter Railway's 'idle detection';
# staat het aan, dan wordt een service zonder inkomend verkeer stilgezet.
sleepApplication = false

# Bewust GEEN healthcheckPath. Een mislukte healthcheck is op Railway zelf een
# reden om de container te stoppen; de worker heeft er geen nodig. GET /health
# op de relay-poort blijft gewoon bestaan om handmatig te kunnen kijken.

# ---------------------------------------------------------------------------
# Regio en aantal instanties.
#
# EU West (Amsterdam). De worker verwerkt persoonsgegevens van partners en
# schrijft naar een EU-database; dan hoort de rekenkant er ook te staan. Zonder
# deze regel zet Railway hem in US West. Scheelt bovendien latency naar de
# EU-Postgres, en dat telt in een live telefoongesprek.
#
# In dit blok staat ook het aantal instanties: multiRegionConfig vervangt het
# losse numReplicas-veld, en de twee kunnen niet naast elkaar bestaan.
# Eén instantie is genoeg. claimPartners() gebruikt 'for update skip locked',
# dus meerdere workers zouden elkaar niet in de weg zitten, maar bij honderd
# partners valt er niets te schalen — en één proces houdt de logs leesbaar.
#
# LET OP: in TOML moet dit sub-blok ná alle losse sleutels van [deploy] staan.
# Alles wat je hieronder zet, hoort bij de regio en niet meer bij [deploy].
# ---------------------------------------------------------------------------
[deploy.multiRegionConfig."europe-west4-drams3a"]
numReplicas = 1
